/* ---- Storage: одна строка в таблице app_data на каждого пользователя ---- */
/* Данные привязаны к user_id и защищены RLS-политиками (см. SQL ниже).      */
async function storageGet(userId, key) {
  const { data, error } = await supabaseClient
    .from("app_data")
    .select(key)
    .eq("user_id", userId)
    .maybeSingle();
  if (error) throw error;
  if (!data || data[key] == null) return null;
  return { value: JSON.stringify(data[key]) };
}
async function storageSet(userId, key, value) {
  const payload = { user_id: userId, [key]: JSON.parse(value), updated_at: new Date().toISOString() };
  const { error } = await supabaseClient.from("app_data").upsert(payload, { onConflict: "user_id" });
  if (error) throw error;
  return { key, value };
}

/* ---- Экран входа / регистрации ---- */
function AuthScreen() {
  const [mode, setMode] = useState("signin"); // "signin" | "signup"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [message, setMessage] = useState(null); // { type: "error"|"info", text }

  async function handleSubmit(e) {
    e.preventDefault();
    setBusy(true);
    setMessage(null);
    try {
      if (mode === "signin") {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) throw error;
        if (data.user && !data.session) {
          setMessage({ type: "info", text: "Проверьте почту и подтвердите регистрацию по ссылке из письма." });
        }
      }
    } catch (err) {
      setMessage({ type: "error", text: err.message || "Что-то пошло не так." });
    } finally {
      setBusy(false);
    }
  }

  return (
    <div style={authStyles.wrap}>
      <style>{CSS}</style>
      <div style={authStyles.card}>
        <div style={authStyles.eyebrow}>Спортивный журнал</div>
        <div style={authStyles.title}>Дневник тренировок</div>

        <div style={{ display: "flex", gap: 6, margin: "18px 0 14px" }}>
          <button
            type="button"
            onClick={() => { setMode("signin"); setMessage(null); }}
            style={{ ...authStyles.modeBtn, ...(mode === "signin" ? authStyles.modeBtnActive : {}) }}
          >
            Войти
          </button>
          <button
            type="button"
            onClick={() => { setMode("signup"); setMessage(null); }}
            style={{ ...authStyles.modeBtn, ...(mode === "signup" ? authStyles.modeBtnActive : {}) }}
          >
            Регистрация
          </button>
        </div>

        <form onSubmit={handleSubmit}>
          <div style={{ marginBottom: 10 }}>
            <div style={authStyles.fieldLabel}>Email</div>
            <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} style={authStyles.input} placeholder="you@example.com" />
          </div>
          <div style={{ marginBottom: 14 }}>
            <div style={authStyles.fieldLabel}>Пароль</div>
            <input type="password" required minLength={6} value={password} onChange={(e) => setPassword(e.target.value)} style={authStyles.input} placeholder="минимум 6 символов" />
          </div>

          {message && (
            <div style={{ ...authStyles.message, color: message.type === "error" ? "#D9483D" : "#4E9A63" }}>
              {message.text}
            </div>
          )}

          <button type="submit" disabled={busy} style={{ ...authStyles.submitBtn, opacity: busy ? 0.7 : 1 }}>
            {busy ? "Секунду…" : mode === "signin" ? "Войти" : "Создать аккаунт"}
          </button>
        </form>
      </div>
    </div>
  );
}

/* ---- Minimal dependency-free line chart (replaces recharts) ---- */
function MiniLineChart({ data, yMin, yMax }) {
  const w = 600, h = 220, padL = 34, padR = 12, padT = 14, padB = 26;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const xFor = (i) => padL + (data.length === 1 ? innerW / 2 : (i / (data.length - 1)) * innerW);
  const yFor = (v) => padT + innerH - ((v - yMin) / (yMax - yMin || 1)) * innerH;
  const points = data.map((d, i) => `${xFor(i)},${yFor(d.weight)}`).join(" ");
  const yTicks = [yMin, (yMin + yMax) / 2, yMax];
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" style={{ display: "block" }}>
      {yTicks.map((t, i) => (
        <g key={i}>
          <line x1={padL} x2={w - padR} y1={yFor(t)} y2={yFor(t)} stroke="#23282B" strokeWidth="1" />
          <text x={4} y={yFor(t) + 3} fontSize="10" fill="#6B7378">{Math.round(t)}</text>
        </g>
      ))}
      <polyline points={points} fill="none" stroke="#F2A93B" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {data.map((d, i) => (
        <circle key={i} cx={xFor(i)} cy={yFor(d.weight)} r="3" fill="#F2A93B" />
      ))}
      {data.map((d, i) => (
        (i === 0 || i === data.length - 1 || i % Math.ceil(data.length / 6) === 0) && (
          <text key={"x" + i} x={xFor(i)} y={h - 6} fontSize="10" fill="#6B7378" textAnchor="middle">{d.dateLabel}</text>
        )
      ))}
    </svg>
  );
}

const pad = (n) => String(n).padStart(2, "0");
const dateKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => dateKey(new Date());

function humanDate(key) {
  const [y, m, d] = key.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return `${dt.getDate()} ${MONTHS[dt.getMonth()].toLowerCase()} ${dt.getFullYear()}`;
}
function shortDate(key) {
  const [, m, d] = key.split("-").map(Number);
  return `${d} ${MONTHS_SHORT[m - 1]}`;
}

function buildMonthMatrix(cursor) {
  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7;
  const gridStart = new Date(year, month, 1 - startOffset);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    cells.push(new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i));
  }
  return cells;
}

function useIsDesktop() {
  const [isDesktop, setIsDesktop] = useState(
    typeof window !== "undefined" ? window.matchMedia("(min-width: 860px)").matches : false
  );
  useEffect(() => {
    const mq = window.matchMedia("(min-width: 860px)");
    const handler = (e) => setIsDesktop(e.matches);
    mq.addEventListener ? mq.addEventListener("change", handler) : mq.addListener(handler);
    return () => (mq.removeEventListener ? mq.removeEventListener("change", handler) : mq.removeListener(handler));
  }, []);
  return isDesktop;
}

const FRONT_VIEWBOX = "0 0 35 93";
const BACK_VIEWBOX = "37 0 35 93";

const SORENESS_LEVELS = [
  { level: 0, label: "Нет", color: "#2B3237" },
  { level: 1, label: "Лёгкая", color: "#4E9A63" },
  { level: 2, label: "Средняя", color: "#D9A23B" },
  { level: 3, label: "Сильная", color: "#D9483D" },
];

function BodyFigure({ view, muscles, mode, selected, intensities, onToggle }) {
  const viewBox = view === "front" ? FRONT_VIEWBOX : BACK_VIEWBOX;
  return (
    <svg viewBox={viewBox} width="100%" style={{ maxWidth: 240, display: "block", margin: "0 auto" }}>
      {muscles.map((m) => {
        let fill, stroke;
        if (mode === "select") {
          const isOn = selected.includes(m.id);
          fill = isOn ? "#F2A93B" : "#2B3237";
          stroke = isOn ? "#F2A93B" : "#3A4247";
        } else {
          const lvl = intensities[m.id] || 0;
          fill = SORENESS_LEVELS[lvl].color;
          stroke = lvl > 0 ? SORENESS_LEVELS[lvl].color : "#3A4247";
        }
        return (
          <path
            key={m.id} d={m.path}
            fill={fill} stroke={stroke} strokeWidth="0.15" strokeLinejoin="round" opacity={0.96}
            style={{ cursor: "pointer", transition: "fill 120ms ease" }}
            onClick={() => onToggle(m.id)}
          >
            <title>{m.label}</title>
          </path>
        );
      })}
    </svg>
  );
}


function muscleLabel(id) {
  const found = [...FRONT_MUSCLES, ...BACK_MUSCLES].find((m) => m.id === id);
  return found ? found.label : id;
}

  const isDesktop = useIsDesktop();
  const [session, setSession] = useState(undefined); // undefined = проверяем, null = гость, объект = вошёл
  const [tab, setTab] = useState("calendar");
  const [monthCursor, setMonthCursor] = useState(() => new Date());
  const [selectedDate, setSelectedDate] = useState(todayKey());
  const [trainings, setTrainings] = useState([]);
  const [soreness, setSoreness] = useState([]);
  const [weights, setWeights] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("idle");

  const [trainingForm, setTrainingForm] = useState(null);
  const [recoveryForm, setRecoveryForm] = useState(null);

  const userId = session && session.user ? session.user.id : null;

  /* Следим за состоянием авторизации Supabase */
  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = supabaseClient.auth.onAuthStateChange((_event, newSession) => {
      setSession(newSession);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  /* Загружаем данные конкретного пользователя, когда он вошёл */
  useEffect(() => {
    if (!userId) { setLoaded(false); return; }
    (async () => {
      let t = [], s = [], w = [];
      try { const r = await storageGet(userId, "trainings"); if (r && r.value) t = JSON.parse(r.value); } catch (e) {}
      try { const r = await storageGet(userId, "soreness"); if (r && r.value) s = JSON.parse(r.value); } catch (e) {}
      try { const r = await storageGet(userId, "weights"); if (r && r.value) w = JSON.parse(r.value); } catch (e) {}
      setTrainings(Array.isArray(t) ? t : []);
      setSoreness(Array.isArray(s) ? s : []);
      setWeights(Array.isArray(w) ? w : []);
      setLoaded(true);
    })();
  }, [userId]);

  async function persist(key, value, setter) {
    setter(value);
    if (!userId) return;
    setSaveState("saving");
    try {
      const res = await storageSet(userId, key, JSON.stringify(value));
      setSaveState(res ? "saved" : "error");
    } catch (e) { setSaveState("error"); }
    setTimeout(() => setSaveState("idle"), 1200);
  }
  const saveTrainings = (list) => persist("trainings", list, setTrainings);
  const saveSoreness = (list) => persist("soreness", list, setSoreness);
  const saveWeights = (list) => persist("weights", list, setWeights);

  const trainingsByDate = useMemo(() => {
    const map = {};
    trainings.forEach((t) => { map[t.date] = map[t.date] || []; map[t.date].push(t); });
    return map;
  }, [trainings]);
  const sorenessByDate = useMemo(() => {
    const map = {};
    soreness.forEach((s) => (map[s.date] = s));
    return map;
  }, [soreness]);

  const monthCells = useMemo(() => buildMonthMatrix(monthCursor), [monthCursor]);
  const dayTrainings = trainingsByDate[selectedDate] || [];
  const daySoreness = sorenessByDate[selectedDate];

  function openNewTraining() {
    setTrainingForm({ id: uid(), date: selectedDate, startTime: "18:00", durationMin: 60, view: "front", muscles: [], exercises: [], note: "", _isNew: true });
  }
  function openEditTraining(t) { setTrainingForm({ ...t, view: "front", _isNew: false }); }
  function deleteTraining(id) { saveTrainings(trainings.filter((t) => t.id !== id)); }
  function submitTraining(form) {
    const clean = { ...form }; delete clean._isNew; delete clean.view;
    const exists = trainings.some((t) => t.id === clean.id);
    saveTrainings(exists ? trainings.map((t) => (t.id === clean.id ? clean : t)) : [...trainings, clean]);
    setTrainingForm(null);
  }

  function openNewRecovery() {
    setRecoveryForm({ id: uid(), date: selectedDate, view: "front", intensities: {}, note: "", _isNew: true });
  }
  function openEditRecovery(s) { setRecoveryForm({ ...s, view: "front", _isNew: false }); }
  function deleteRecovery(id) { saveSoreness(soreness.filter((s) => s.id !== id)); }
  function submitRecovery(form) {
    const clean = { ...form }; delete clean._isNew; delete clean.view;
    const exists = soreness.some((s) => s.id === clean.id);
    saveSoreness(exists ? soreness.map((s) => (s.id === clean.id ? clean : s)) : [...soreness, clean]);
    setRecoveryForm(null);
  }

  const tabs = [
    { id: "calendar", label: "Календарь", icon: CalendarIcon },
    { id: "recovery", label: "Восстановление", icon: ClipboardList },
    { id: "weight", label: "Вес", icon: Scale },
  ];

  if (session === undefined) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#101314", color: "#8A9296", fontFamily: "'Inter', sans-serif" }}>
        Проверяем вход…
      </div>
    );
  }
  if (!session) {
    return <AuthScreen />;
  }

  return (
    <div className="app-shell">
      <style>{CSS}</style>
      <div className="app-inner">
        <header style={styles.header}>
          <div>
            <div style={styles.headerEyebrow}>Спортивный журнал</div>
            <div style={styles.headerTitle}>Дневник тренировок</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <SaveIndicator state={saveState} />
            <button
              onClick={() => supabaseClient.auth.signOut()}
              style={{ background: "transparent", border: "1px solid #2B3237", borderRadius: 8, color: "#8A9296", fontSize: 11, padding: "5px 9px", cursor: "pointer" }}
            >
              Выйти
            </button>
          </div>
        </header>

        <div className="layout-grid">
          <nav className="side-nav">
            {tabs.map((t) => (
              <SideNavButton key={t.id} icon={t.icon} label={t.label} active={tab === t.id} onClick={() => setTab(t.id)} />
            ))}
          </nav>

          <main style={styles.main}>
            {tab === "calendar" && (
              <CalendarTab
                monthCursor={monthCursor} setMonthCursor={setMonthCursor} monthCells={monthCells}
                selectedDate={selectedDate} setSelectedDate={setSelectedDate}
                trainingsByDate={trainingsByDate} sorenessByDate={sorenessByDate}
                dayTrainings={dayTrainings} daySoreness={daySoreness}
                onAddTraining={openNewTraining} onEditTraining={openEditTraining} onDeleteTraining={deleteTraining}
                onAddRecovery={openNewRecovery} onEditRecovery={openEditRecovery} onDeleteRecovery={deleteRecovery}
              />
            )}
            {tab === "recovery" && (
              <RecoveryHistoryTab
                soreness={[...soreness].sort((a, b) => (a.date < b.date ? 1 : -1))}
                onEdit={openEditRecovery} onDelete={deleteRecovery}
                onNew={() => { setSelectedDate(todayKey()); openNewRecovery(); }}
              />
            )}
            {tab === "weight" && (
              <WeightTab weights={weights} onSave={saveWeights} />
            )}
          </main>
        </div>
      </div>

      <nav className="bottom-tabbar">
        {tabs.map((t) => (
          <TabButton key={t.id} icon={t.icon} label={t.label} active={tab === t.id} onClick={() => setTab(t.id)} />
        ))}
      </nav>

      {trainingForm && (
        <TrainingModal form={trainingForm} setForm={setTrainingForm} onCancel={() => setTrainingForm(null)} onSubmit={submitTraining} />
      )}
      {recoveryForm && (
        <RecoveryModal form={recoveryForm} setForm={setRecoveryForm} onCancel={() => setRecoveryForm(null)} onSubmit={submitRecovery} />
      )}

      {!loaded && (
        <div style={styles.loadingOverlay}>
          <div style={styles.loadingText}>Загрузка данных…</div>
        </div>
      )}
    </div>
  );
}

/* Save indicator & nav buttons                                            */

function SaveIndicator({ state }) {
  const label = { idle: "Синхронизировано", saving: "Сохранение…", saved: "Сохранено", error: "Ошибка сохранения" }[state];
  const color = state === "error" ? "#D9483D" : state === "saving" ? "#F2A93B" : "#4E9A63";
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "#8A9296", fontFamily: "Inter, sans-serif", whiteSpace: "nowrap" }}>
      <span style={{ width: 7, height: 7, borderRadius: 999, background: color, display: "inline-block" }} />
      {label}
    </div>
  );
}

function TabButton({ icon: Icon, label, active, onClick }) {
  return (
    <button onClick={onClick} style={{ ...styles.tabButton, color: active ? "#F2A93B" : "#8A9296" }}>
      <Icon size={20} strokeWidth={active ? 2.4 : 1.8} />
      <span style={{ fontSize: 11, marginTop: 2 }}>{label}</span>
    </button>
  );
}

function SideNavButton({ icon: Icon, label, active, onClick }) {
  return (
    <button
      onClick={onClick}
      style={{
        display: "flex", alignItems: "center", gap: 10, width: "100%", textAlign: "left",
        background: active ? "#1E2226" : "transparent", border: "1px solid", borderColor: active ? "#2B3237" : "transparent",
        borderRadius: 10, padding: "10px 12px", color: active ? "#F2A93B" : "#B7BCC0", fontSize: 14, cursor: "pointer",
      }}
    >
      <Icon size={18} strokeWidth={active ? 2.4 : 1.8} />
      {label}
    </button>
  );
}

function CalendarTab({
  monthCursor, setMonthCursor, monthCells, selectedDate, setSelectedDate,
  trainingsByDate, sorenessByDate, dayTrainings, daySoreness,
  onAddTraining, onEditTraining, onDeleteTraining,
  onAddRecovery, onEditRecovery, onDeleteRecovery,
}) {
  const curMonth = monthCursor.getMonth();
  return (
    <div className="calendar-columns">
      <div>
        <div style={styles.monthNav}>
          <button style={styles.iconBtn} onClick={() => setMonthCursor(new Date(monthCursor.getFullYear(), monthCursor.getMonth() - 1, 1))}><ChevronLeft size={18} /></button>
          <div style={styles.monthLabel}>{MONTHS[curMonth]} {monthCursor.getFullYear()}</div>
          <button style={styles.iconBtn} onClick={() => setMonthCursor(new Date(monthCursor.getFullYear(), monthCursor.getMonth() + 1, 1))}><ChevronRight size={18} /></button>
        </div>
        <div style={styles.weekdayRow}>
          {WEEKDAYS.map((w) => <div key={w} style={styles.weekdayCell}>{w}</div>)}
        </div>
        <div style={styles.grid}>
          {monthCells.map((d, i) => {
            const key = dateKey(d);
            const inMonth = d.getMonth() === curMonth;
            const isSelected = key === selectedDate;
            const isToday = key === todayKey();

            const hasSoreness = !!sorenessByDate[key];
            return (
              <button
                key={i} onClick={() => setSelectedDate(key)}
                style={{
                  ...styles.dayCell, opacity: inMonth ? 1 : 0.32,
                  background: isSelected ? "#F2A93B" : "transparent",
                  color: isSelected ? "#141718" : "#EDEFEF",
                  boxShadow: isToday && !isSelected ? "inset 0 0 0 1px #F2A93B" : "none",
                }}
              >
                <span>{d.getDate()}</span>
                <span style={styles.dotRow}>
                  {hasTraining && <span style={{ ...styles.dot, background: isSelected ? "#141718" : "#4C8DFF" }} />}
                  {hasSoreness && <span style={{ ...styles.dot, background: isSelected ? "#141718" : "#D9483D" }} />}
                </span>
              </button>
            );
          })}
        </div>
      </div>

      <div style={styles.dayPanel} className="day-panel">
        <div style={styles.dayPanelHeader}>{humanDate(selectedDate)}</div>
        <SectionLabel text="Тренировки" />
        {dayTrainings.length === 0 && <EmptyHint text="В этот день пока нет тренировок." />}
        {dayTrainings.map((t) => (
          <TrainingCard key={t.id} training={t} onEdit={() => onEditTraining(t)} onDelete={() => onDeleteTraining(t.id)} />
        ))}
        <button style={styles.addLink} onClick={onAddTraining}><Plus size={15} /> Добавить тренировку</button>

        <div style={{ height: 18 }} />

        <SectionLabel text="Как вы себя чувствуете" />
        {!daySoreness && <EmptyHint text="Для этого дня пока нет заметки о самочувствии." />}
        {daySoreness && <RecoveryCard entry={daySoreness} onEdit={() => onEditRecovery(daySoreness)} onDelete={() => onDeleteRecovery(daySoreness.id)} />}
        {!daySoreness && (
          <button style={styles.addLink} onClick={onAddRecovery}><Plus size={15} /> Записать самочувствие</button>
        )}
      </div>
    </div>
  );
}

function SectionLabel({ text }) { return <div style={styles.sectionLabel}>{text}</div>; }
function EmptyHint({ text }) { return <div style={styles.emptyHint}>{text}</div>; }

function RecoveryCard({ entry, onEdit, onDelete }) {

function RecoveryHistoryTab({ soreness, onEdit, onDelete, onNew }) {
  return (
    <div>
      <div style={styles.dayPanelHeader}>Заметки о восстановлении</div>
      <div style={{ ...styles.emptyHint, marginBottom: 12 }}>
        Короткая отметка о том, как чувствуют себя мышцы на следующий день после тренировки.
      </div>
      <button style={styles.primaryBtnSmall} onClick={onNew}><Plus size={15} /> Записать самочувствие сегодня</button>

      {soreness.length === 0 && <EmptyHint text="Пока ничего не записано." />}

    </div>

}

/* ---------------------------------------------------------------------- */
/* Weight tab                                                              */
/* ---------------------------------------------------------------------- */

function WeightTab({ weights, onSave }) {
  const [date, setDate] = useState(todayKey());
  const [value, setValue] = useState("");
  const [editingId, setEditingId] = useState(null);

  const sorted = useMemo(() => [...weights].sort((a, b) => (a.date < b.date ? -1 : 1)), [weights]);
  const chartData = sorted.map((w) => ({ dateLabel: shortDate(w.date), date: w.date, weight: w.weight }));
  const last = sorted[sorted.length - 1];
  const prev = sorted[sorted.length - 2];
  const delta = last && prev ? +(last.weight - prev.weight).toFixed(1) : null;

  function resetForm() { setDate(todayKey()); setValue(""); setEditingId(null); }

  function handleSave() {
    const num = parseFloat(value.replace(",", "."));
    if (!num || num <= 0) return;
    let list;
    if (editingId) {
      list = weights.map((w) => (w.id === editingId ? { ...w, date, weight: num } : w));
    } else {
      const sameDate = weights.find((w) => w.date === date);
      if (sameDate) {
        list = weights.map((w) => (w.id === sameDate.id ? { ...w, weight: num } : w));
      } else {
        list = [...weights, { id: uid(), date, weight: num }];
      }
    }
    onSave(list);
    resetForm();
  }
  function handleEdit(w) { setEditingId(w.id); setDate(w.date); setValue(String(w.weight)); }
  function handleDelete(id) { onSave(weights.filter((w) => w.id !== id)); if (editingId === id) resetForm(); }

  const yValues = chartData.map((d) => d.weight);
  const yMin = yValues.length ? Math.floor(Math.min(...yValues) - 1) : 0;
  const yMax = yValues.length ? Math.ceil(Math.max(...yValues) + 1) : 100;

  return (
    <div className="weight-columns">
      <div>
        <div style={styles.dayPanelHeader}>Вес тела</div>

        <div style={styles.statsRow}>
          <div style={styles.statCard}>
            <div style={styles.statLabel}>Текущий вес</div>
            <div style={styles.statValue}>{last ? `${last.weight} кг` : "—"}</div>
          </div>
          <div style={styles.statCard}>
            <div style={styles.statLabel}>Изменение</div>
            <div style={{ ...styles.statValue, color: delta > 0 ? "#D9483D" : delta < 0 ? "#4E9A63" : "#EDEFEF" }}>
              {delta === null ? "—" : `${delta > 0 ? "+" : ""}${delta} кг`}
            </div>
          </div>
          <div style={styles.statCard}>
            <div style={styles.statLabel}>Записей</div>
            <div style={styles.statValue}>{weights.length}</div>
          </div>
        </div>

        <div style={styles.chartWrap}>
          {chartData.length >= 2 ? (
            <MiniLineChart data={chartData} yMin={yMin} yMax={yMax} />
          ) : (
            <EmptyHint text="Добавьте хотя бы два замера, чтобы увидеть график изменения веса." />
          )}
        </div>

        <SectionLabel text={editingId ? "Изменить запись" : "Добавить замер"} />
        <div style={styles.exBuilder}>
          <FieldRow>
            <Field label="Дата"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={styles.input} /></Field>
            <Field label="Вес (кг)"><input type="number" min="0" step="0.1" placeholder="напр. 78.4" value={value} onChange={(e) => setValue(e.target.value)} style={styles.input} /></Field>
          </FieldRow>
          <div style={{ display: "flex", gap: 8 }}>
            <button style={styles.primaryBtnSmall} onClick={handleSave}><Check size={15} /> {editingId ? "Сохранить изменения" : "Добавить"}</button>
            {editingId && <button style={styles.secondaryBtnSmall} onClick={resetForm}>Отмена</button>}
          </div>
        </div>
      </div>

      <div>
        <SectionLabel text="История замеров" />
        {sorted.length === 0 && <EmptyHint text="Пока нет ни одной записи." />}
        <div>
          {[...sorted].reverse().map((w) => (
            <div key={w.id} style={styles.weightRow}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 600 }}>{w.weight} кг</div>
                <div style={{ fontSize: 12, color: "#8A9296" }}>{humanDate(w.date)}</div>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button style={styles.iconBtnSmall} onClick={() => handleEdit(w)}><Pencil size={13} /></button>
                <button style={styles.iconBtnSmall} onClick={() => handleDelete(w.id)}><Trash2 size={14} /></button>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Training modal (add / edit)                                             */
/* ---------------------------------------------------------------------- */

function TrainingModal({ form, setForm, onCancel, onSubmit }) {
  const [draftEx, setDraftEx] = useState({ type: "reps", name: "", weight: "", reps: "", sets: "", duration: "", speed: "", incline: "" });

  function toggleMuscle(id) {
    setForm((f) => ({ ...f, muscles: f.muscles.includes(id) ? f.muscles.filter((m) => m !== id) : [...f.muscles, id] }));
  }
  function addExercise() {
    if (!draftEx.name.trim()) return;
    setForm((f) => ({ ...f, exercises: [...f.exercises, { id: uid(), ...draftEx }] }));
    setDraftEx({ type: draftEx.type, name: "", weight: "", reps: "", sets: "", duration: "", speed: "", incline: "" });
  }
  function removeExercise(id) { setForm((f) => ({ ...f, exercises: f.exercises.filter((e) => e.id !== id) })); }

  const muscles = form.view === "front" ? FRONT_MUSCLES : BACK_MUSCLES;

  return (
    <ModalShell title={form._isNew ? "Новая тренировка" : "Изменить тренировку"} onCancel={onCancel}>
      <FieldRow>
        <Field label="Дата"><input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} style={styles.input} /></Field>
        <Field label="Время начала"><input type="time" value={form.startTime} onChange={(e) => setForm({ ...form, startTime: e.target.value })} style={styles.input} /></Field>
        <Field label="Продолжительность (мин)"><input type="number" min="0" value={form.durationMin} onChange={(e) => setForm({ ...form, durationMin: Number(e.target.value) })} style={styles.input} /></Field>
      </FieldRow>

      <SectionLabel text="Задействованные мышцы" />
      <ViewToggle view={form.view} onChange={(v) => setForm({ ...form, view: v })} />
      <BodyFigure view={form.view} muscles={muscles} mode="select" selected={form.muscles} intensities={{}} onToggle={toggleMuscle} />
      {form.muscles.length > 0 && (
        <div style={styles.chipRow}>{form.muscles.map((m) => <span key={m} style={styles.chip}>{muscleLabel(m)}</span>)}</div>
      )}

      <SectionLabel text="Упражнения" />
      {form.exercises.length > 0 && (
        <ul style={styles.exList}>
          {form.exercises.map((ex) => (
            <li key={ex.id} style={styles.exItem}>
              {ex.type === "reps" ? <Dumbbell size={13} /> : <Timer size={13} />}
              <span style={{ fontWeight: 600 }}>{ex.name}</span>
              <span style={{ color: "#8A9296" }}>
                {ex.type === "reps"
                  ? ` · ${ex.sets} × ${ex.reps} повт.${ex.weight ? ` @ ${ex.weight} кг` : ""}`
                  : ` · ${ex.duration} мин${ex.speed ? ` · ${ex.speed} км/ч` : ""}${ex.incline ? ` · наклон ${ex.incline}` : ""}`}
              </span>
              <button style={styles.removeBtn} onClick={() => removeExercise(ex.id)}><X size={13} /></button>
            </li>
          ))}
        </ul>
      )}

      <div style={styles.quickRow}>
        {QUICK_EXERCISES.map((q) => (
          <button key={q.name} style={styles.quickChip} onClick={() => setDraftEx({ ...draftEx, type: q.type, name: q.name })}>{q.name}</button>
        ))}
      </div>

      <div style={styles.exBuilder}>
        <div style={styles.typeToggle}>
          <button style={{ ...styles.typeToggleBtn, ...(draftEx.type === "reps" ? styles.typeToggleBtnActive : {}) }} onClick={() => setDraftEx({ ...draftEx, type: "reps" })}>
            <Dumbbell size={14} /> Повторения и вес
          </button>
          <button style={{ ...styles.typeToggleBtn, ...(draftEx.type === "duration" ? styles.typeToggleBtnActive : {}) }} onClick={() => setDraftEx({ ...draftEx, type: "duration" })}>
            <Timer size={14} /> Длительность
          </button>
        </div>

        <input placeholder="Название упражнения (напр. Приседания)" value={draftEx.name} onChange={(e) => setDraftEx({ ...draftEx, name: e.target.value })} style={styles.input} />

        {draftEx.type === "reps" ? (
          <FieldRow>
            <Field label="Подходы"><input type="number" min="0" value={draftEx.sets} onChange={(e) => setDraftEx({ ...draftEx, sets: e.target.value })} style={styles.input} /></Field>
            <Field label="Повторения"><input type="number" min="0" value={draftEx.reps} onChange={(e) => setDraftEx({ ...draftEx, reps: e.target.value })} style={styles.input} /></Field>
            <Field label="Вес (кг)"><input type="number" min="0" step="0.5" value={draftEx.weight} onChange={(e) => setDraftEx({ ...draftEx, weight: e.target.value })} style={styles.input} /></Field>
          </FieldRow>
        ) : (
          <FieldRow>
            <Field label="Длительность (мин)"><input type="number" min="0" value={draftEx.duration} onChange={(e) => setDraftEx({ ...draftEx, duration: e.target.value })} style={styles.input} /></Field>
            <Field label="Скорость (км/ч)"><input type="number" min="0" step="0.1" value={draftEx.speed} onChange={(e) => setDraftEx({ ...draftEx, speed: e.target.value })} style={styles.input} /></Field>
            <Field label="Наклон"><input type="number" min="0" step="0.5" value={draftEx.incline} onChange={(e) => setDraftEx({ ...draftEx, incline: e.target.value })} style={styles.input} /></Field>
          </FieldRow>
        )}
        <button style={styles.addLink} onClick={addExercise}><Plus size={15} /> Добавить упражнение в тренировку</button>
      </div>

      <SectionLabel text="Заметки" />
      <textarea placeholder="Как прошла тренировка?" value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} style={styles.textarea} />

      <ModalActions onCancel={onCancel} onSubmit={() => onSubmit(form)} submitLabel="Сохранить тренировку" />
    </ModalShell>
  );
}

/* ---------------------------------------------------------------------- */
/* Recovery modal                                                          */
/* ---------------------------------------------------------------------- */

function RecoveryModal({ form, setForm, onCancel, onSubmit }) {
  const muscles = form.view === "front" ? FRONT_MUSCLES : BACK_MUSCLES;
  function cycleMuscle(id) {
    setForm((f) => { const cur = f.intensities[id] || 0; return { ...f, intensities: { ...f.intensities, [id]: (cur + 1) % 4 } }; });
  }
  function resetAll() { setForm((f) => ({ ...f, intensities: {} })); }
  const activeMuscles = Object.entries(form.intensities).filter(([, v]) => v > 0);

  return (
    <ModalShell title={form._isNew ? "Как вы себя чувствуете?" : "Изменить заметку"} onCancel={onCancel}>
      <Field label="Дата"><input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} style={styles.input} /></Field>

      <SectionLabel text="Нажмите на мышцу: нет → лёгкая → средняя → сильная" />
      <ViewToggle view={form.view} onChange={(v) => setForm({ ...form, view: v })} />
      <BodyFigure view={form.view} muscles={muscles} mode="soreness" selected={[]} intensities={form.intensities} onToggle={cycleMuscle} />

      <div style={styles.legendRow}>
        {SORENESS_LEVELS.map((l) => (
          <div key={l.level} style={styles.legendItem}><span style={{ ...styles.legendSwatch, background: l.color }} />{l.label}</div>
        ))}
      </div>

      {activeMuscles.length > 0 && (
        <div style={styles.chipRow}>
          {activeMuscles.map(([id, lvl]) => (
            <span key={id} style={{ ...styles.chip, background: SORENESS_LEVELS[lvl].color, color: "#101314" }}>{muscleLabel(id)} · {SORENESS_LEVELS[lvl].label}</span>
          ))}
        </div>
      )}
      <button style={styles.addLink} onClick={resetAll}><RotateCcw size={14} /> Очистить всё</button>

      <SectionLabel text="Заметки" />
      <textarea placeholder="Что-то ещё о самочувствии?" value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} style={styles.textarea} />

      <ModalActions onCancel={onCancel} onSubmit={() => onSubmit(form)} submitLabel="Сохранить заметку" />
    </ModalShell>
  );
}

/* ---------------------------------------------------------------------- */
/* Shared small components                                                 */
/* ---------------------------------------------------------------------- */

function ViewToggle({ view, onChange }) {
  return (
    <div style={styles.typeToggle}>
      <button style={{ ...styles.typeToggleBtn, ...(view === "front" ? styles.typeToggleBtnActive : {}) }} onClick={() => onChange("front")}>Спереди</button>
      <button style={{ ...styles.typeToggleBtn, ...(view === "back" ? styles.typeToggleBtnActive : {}) }} onClick={() => onChange("back")}>Сзади</button>
    </div>
  );
}
function Field({ label, children }) {
  return <div style={{ flex: 1, minWidth: 90 }}><div style={styles.fieldLabel}>{label}</div>{children}</div>;
}
function FieldRow({ children }) { return <div style={styles.fieldRow}>{children}</div>; }

function ModalShell({ title, onCancel, children }) {
  return (
    <div className="modal-overlay" onClick={onCancel}>
      <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
        <div style={styles.modalHeader}>
          <div style={styles.modalTitle}>{title}</div>
          <button style={styles.iconBtn} onClick={onCancel}><X size={18} /></button>
        </div>
        <div style={styles.modalBody}>{children}</div>
      </div>
    </div>
  );
}
function ModalActions({ onCancel, onSubmit, submitLabel }) {
  return (
    <div style={styles.modalActions}>
      <button style={styles.secondaryBtn} onClick={onCancel}>Отмена</button>
      <button style={styles.primaryBtn} onClick={onSubmit}><Check size={15} /> {submitLabel}</button>
    </div>
  );
}
